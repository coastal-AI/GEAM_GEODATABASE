<!DOCTYPE html>
<html lang="en">
<head>
    <title>GEAM GEODATABASE</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="data/1_SEATRUTH_table.js"></script> 
    <script src="data/2_DRONE_table.js"></script> 
    <script src="data/3_VIDEO_TRACKS_table.js"></script> 
    <script src="data/6_STATIONS_table.js"></script> 
</head>
<body>
    <header>
        <div class="header-top">
            <div class="header-text">GEAM GEODATABASE</div>
            <div class="header-links">
                <a href="info.html">Info</a>
                <a href="https://github.com/coastal-AI" target="_blank">
                    <img src="assets/github.png" alt="GitHub Logo" style="width: 1em; height: 1em;">
                </a>
            </div>
        </div>
        <div class="subtitle">Seagrass Ecology Group IEO-CSIC</div>
    </header>

    <div id="map"></div>

    <footer>
        <!-- New line of text before logos -->
        <div class="logos">
            <img src="assets/logoGEAM.png" alt="Logo GEAM" class="logo">
            <img src="assets/logoIEO.png" alt="Logo IEO" class="logo">
            <img src="assets/logoCSIC.png" alt="Logo CSIC" class="logo">
            <img src="assets/logoNexGen.png" alt="Logo NexGen" class="logo">
            <img src="assets/logoCARM.png" alt="Logo CARM" class="logo">
        </div>

    </footer>

    <script>
        function setRealVh() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
    
        window.addEventListener('resize', setRealVh);
        window.addEventListener('load', setRealVh);
    </script>

    <script>

        // Define tile layers
        const cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/">CARTO</a>',
            maxZoom: 20
        });

        const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'ESRI World Imagery',
            maxZoom: 20
        });

        // Initialize the map
        var map = L.map('map', {
            center: [36, -5], // Center the map
            zoom: 5, // Initial zoom level
            layers: [esriSat], // Default layer
            scrollWheelZoom: true, // Disable scroll zoom initially
            zoomControl: false // Disable default zoom control
        });
        
        // Add single zoom control at bottom right
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Define basemap layers
        const baseMaps = {
            "Esri Satellite": esriSat,
            "Carto Light": cartoLight
        };





        // Helper function to determine layer name
        function getLayerName(layer) {
            if (layer === stationsLayer) {
                return "MONITORING STATION";
            } else if (layer === seatruthLayer) {
                return "FIELD OBSERVATION";
            } else if (layer === droneLayer) {
                return "DRONE FLIGHT";
            } else if (layer === tracksLayer) {
                return "UNDERWATER VIDEO TRACK";
            }
            return "DATA ID";
        }

        // Helper function to get color for institution using deterministic hash
        function getInstitutionColor(institution) {
            // Handle null/undefined/NaN
            if (!institution || institution === 'nan' || institution === null) {
                return "#CCCCCC"; // Light gray for unknown
            }
            
            // Define a palette of distinctive colors
            const colors = [
                '#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#6C5CE7', '#A8E6CF',
                '#FFD93D', '#FF8B94', '#D4A5A5', '#5DADE2', '#F8B88B', '#AA96DA',
                '#FCBAD3', '#A0DE82', '#FFA07A', '#20B2AA', '#DDA0DD', '#F0E68C',
                '#87CEEB', '#F4A460', '#98D8C8', '#F7DC6F', '#B19CD9', '#FF69B4'
            ];
            
            // Simple hash function for institution string
            let hash = 0;
            for (let i = 0; i < institution.length; i++) {
                hash = institution.charCodeAt(i) + ((hash << 5) - hash);
            }
            
            // Use hash to select color deterministically
            return colors[Math.abs(hash) % colors.length];
        }

        // Simplified popup function - info only
        function showPopupInfo(item, latlng, layer) {
            var popupContent = document.createElement("div");
            popupContent.className = "popup-content";

            const layerName = getLayerName(layer);
            const itemId = item.observation_id || item.flight_id || item.station_id || item.track_id || item.id;

            popupContent.innerHTML = `
                <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 10px; margin: -3px;">
                    <div style="border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; margin-bottom: 10px;">
                        <div style="font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">${layerName}</div>
                        <div style="font-size: 14px; font-weight: 700; color: #222; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${itemId}</div>
                    </div>
                    <div style="font-size: 12px; color: #555; line-height: 1.6;">
                        ${item.date_time ? `<div><span style="color: #999;">Date:</span> ${item.date_time}</div>` : ''}
                        ${item.recorded_by_institution ? `<div><span style="color: #999;">Institution:</span> ${item.recorded_by_institution}</div>` : ''}
                        ${item.project ? `<div><span style="color: #999;">Project:</span> ${item.project}</div>` : ''}
                        ${item.contact ? `<div><span style="color: #999;">Contact:</span> ${item.contact}</div>` : ''}
                    </div>
                </div>
            `;

            L.popup({ maxWidth: 260 })
                .setLatLng(latlng)
                .setContent(popupContent)
                .openOn(map);
        }


        // LAYERS
        var seatruthLayer = L.markerClusterGroup({
            maxClusterRadius: 60, // Cluster if markers within 60px radius
            disableClusteringAtZoom: 13, 
            iconCreateFunction: function(cluster) {
                return L.divIcon({
                    html: '<svg width="40" height="40" viewBox="0 0 40 40" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));"><circle cx="20" cy="20" r="15" fill="#2ecc71" fill-opacity="0.7" stroke="#2ecc71" stroke-width="2" /><text x="20" y="25" text-anchor="middle" fill="white" font-weight="bold" font-size="14">' + cluster.getChildCount() + '</text></svg>',
                    iconSize: [40, 40],
                    className: 'seatruth-cluster'
                });
            }
        });
        var droneLayer = L.layerGroup();
        var tracksLayer = L.layerGroup();
        var stationsLayer = L.markerClusterGroup({
            maxClusterRadius: 50, // Cluster if markers within 50px radius
            disableClusteringAtZoom: 9, 
            iconCreateFunction: function(cluster) {
                return L.divIcon({
                    html: '<svg width="40" height="40" viewBox="0 0 40 40" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));"><rect x="5" y="5" width="30" height="30" fill="#95a5a6" fill-opacity="0.7" stroke="#95a5a6" stroke-width="2" /><text x="20" y="25" text-anchor="middle" fill="#444444" font-weight="bold" font-size="14">' + cluster.getChildCount() + '</text></svg>',
                    iconSize: [40, 40],
                    className: 'stations-cluster'
                });
            }
        });
  

        //SEATRUTH
        seatruth.forEach(function(item) {
            var marker = L.circleMarker([item.lat, item.lon], {
                radius: 0.5, // Adjust the radius as needed
                color: 'green', // Adjust the color as needed
                fillOpacity: 0.5 // Adjust the fill opacity as needed
            }).addTo(seatruthLayer);
            ;

            marker.on('click', function() {
                showPopupInfo(item, [item.lat, item.lon], seatruthLayer);
            });
        });
    
        
        //DRONE
        // Add polygons
        drone.forEach(function(item) {
            var polygon = L.polygon(item.polygon, {
            color: 'blue', 
            fillOpacity: 0.05,
            weight: 1 // Adjust the line width as needed
            }).addTo(droneLayer);
        });

        // Add markers 
        drone.forEach(function(item) {
            var marker = L.circleMarker([item.lat, item.lon], {
                radius: 4, // Adjust the radius as needed
                color: 'lightblue', // Adjust the color as needed
                fillColor: 'blue', // Adjust the fill color to light blue
                fillOpacity: 0.5 // Adjust the fill opacity as needed
            }).addTo(droneLayer);

            marker.on('click', function() {
                showPopupInfo(item, [item.lat, item.lon], droneLayer);
            });
        });

        //TRACKS
        // Add lines
        tracks.forEach(function(item) {
            var line = L.polyline(item.line, {
            color: 'red', 
            weight: 4 // Adjust the line width as needed
            }).addTo(tracksLayer);

            // Add click event to show popup
            line.on('click', function(e) {
                showPopupInfo(item, e.latlng, tracksLayer);
            });

        });

        //STATIONS
        stations.forEach(function(item) {
            var color = getInstitutionColor(item.recorded_by_institution);
            var marker = L.marker([item.lat, item.lon], {
                icon: L.divIcon({
                    className: 'square-marker',  // Custom class for styling
                    html: '<svg width="15" height="15" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" stroke="' + color + '" stroke-width="2" fill="none" /></svg>',  // Square outline with dynamic color
                    iconSize: [20, 20],  // Size of the marker
                    iconAnchor: [10, 10]  // Center the square in the marker
                })
            }).addTo(stationsLayer);
            ;

            marker.on('click', function() {
                showPopupInfo(item, [item.lat, item.lon], stationsLayer);
            });
        });

    
        // Add layers to the map 
        seatruthLayer.addTo(map);
        droneLayer.addTo(map);
        tracksLayer.addTo(map);
        stationsLayer.addTo(map);


        L.control.scale({ position: 'bottomright' }).addTo(map);


        
        
        var legend = L.control({ position: 'topleft' });

        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'info legend');
            
            // Define the symbols and labels for each layer
            var layersInfo = [
                 { 
                    label: 'Monitoring Stations (color by institution)', 
                    symbol: '<svg width="20" height="20" viewBox="0 0 20 20" style="display: inline-block; vertical-align: middle;"><rect x="2" y="2" width="16" height="16" fill="#95a5a6" fill-opacity="0.7" stroke="#95a5a6" stroke-width="1.5" /></svg>'  // Square with gray edge and 0.7 opacity fill
                },
                { 
                    label: 'Seagrass Presence/Absence', 
                    symbol: '<svg width="20" height="20" viewBox="0 0 20 20" style="display: inline-block; vertical-align: middle;"><circle cx="10" cy="10" r="8" fill="#2ecc71" fill-opacity="0.8" stroke="#2ecc71" stroke-width="1.5" /></svg>'  // Green circle with edge and 0.8 opacity fill
                },
                { 
                    label: 'Drone Surveys', 
                    symbol: '<svg width="12" height="12" viewBox="0 0 20 20" style="display: inline-block; vertical-align: middle;"><circle cx="10" cy="10" r="8" fill="lightblue" stroke="darkblue" stroke-width="1.5" /></svg>'  // Circle with light blue fill and dark blue border
                },
                { 
                    label: 'Underwater Video Tracks', 
                    symbol: '<div class="red-line"></div>'  // Red line for Underwater Video Tracks
                }
               
            ];

            // Add all layers to legend
            layersInfo.forEach(function (layer) {
                div.innerHTML += '<span style="display: inline-flex; align-items: center; width: 24px; height: 24px; margin-right: 8px;">' + layer.symbol + '</span>' + layer.label + '<br>';
            });

            return div;
        };

        legend.addTo(map);

                // Add layer control for toggling layers
        var overlayMaps = {
            "Seagrass Presence/Absence data": seatruthLayer,
            "Drone Surveys": droneLayer,
            "Underwater Video Tracks": tracksLayer,
            "Monitoring Stations": stationsLayer,
        };

        L.control.layers(null, overlayMaps, {
            collapsed: true,
            position: 'topleft'
        }).addTo(map);

        // Zoom level and coordinates display
        var zoomInfo = L.control({ position: 'bottomright' });

        zoomInfo.onAdd = function () {
            var div = L.DomUtil.create('div', 'info zoom-info');
            div.style.marginTop = '50px'; // Space below legend
            div.innerHTML = '<div style="font-size: 11px; color: #666; line-height: 1.6;">Zoom: <span id="zoom-level">5</span><br>Lat: <span id="lat-value">36.00</span><br>Lng: <span id="lng-value">-5.00</span></div>';
            return div;
        };

        zoomInfo.addTo(map);

        // Update zoom level and mouse coordinates
        function updateZoomAndCoords(e) {
            document.getElementById('zoom-level').textContent = map.getZoom();
            if (e && e.latlng) {
                // e.latlng is updated on mousemove
                document.getElementById('lat-value').textContent = e.latlng.lat.toFixed(4);
                document.getElementById('lng-value').textContent = e.latlng.lng.toFixed(4);
            }
        }

        map.on('zoom', updateZoomAndCoords);
        map.on('mousemove', updateZoomAndCoords);
        updateZoomAndCoords(); // Initial update

        // Add base layer control (after other controls so it appears below)
        L.control.layers(baseMaps, null, { position: 'topleft' }).addTo(map);
    


    </script>

</body>
</html>
